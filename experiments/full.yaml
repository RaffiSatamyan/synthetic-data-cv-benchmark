# Full ImageNet-100 classification benchmark grid.
# real_fraction x synthetic_ratio x seed, per the Aug-2026 design.
datasets:
  - name: imagenet100
    model: resnet18

real_fractions: [0.01, 0.03, 0.05, 0.10, 0.25, 0.50, 1.0]
seeds: [0, 1, 2]

baselines:
  - real_only
  - classical_augmentation

synthetic:
  generators:
    - stable_diffusion
    - stylegan2
  ratios: [0.5, 1.0, 2.0, 5.0, 10.0]
