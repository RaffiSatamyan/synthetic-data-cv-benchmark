name: imagenet100_pilot

datasets:
  - configs/datasets/imagenet100.yaml

models:
  - configs/models/resnet18.yaml

real_fractions:
  - 0.01
  - 0.10

synthetic:
  generators:
    - real_only
  ratios:
    - 0.0

augmentations:
  - baseline
  - random_resized_crop
  - horizontal_flip

seeds:
  - 42

training:
  config: configs/training.yaml
  epochs: 1

output_root: outputs
