# Small grid to smoke-test the full classification pipeline end to end.
# Uses only baselines, so it needs no generated synthetic images.
datasets:
  - name: imagenet100
    model: resnet18

real_fractions: [0.01, 0.10]
seeds: [0]

baselines:
  - real_only
  - classical_augmentation

synthetic:
  generators: []
  ratios: []
