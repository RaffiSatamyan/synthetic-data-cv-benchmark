name: imagenet100_kaggle
task: classification

num_classes: 100
label_column: label
image_column: image_path
primary_metric: accuracy

# Writable working dir on Kaggle; splits + manifest are written here.
data_root: /kaggle/working/imagenet100

# Where the class folders physically live (read-only Kaggle mount). Split CSVs
# store paths RELATIVE to this, so the committed split resolves on any machine
# by just repointing image_root.
# NOTE: this notebook mounts under .../input/competitions/... (verified via ls).
image_root: /kaggle/input/competitions/imagenet-object-localization-challenge/ILSVRC/Data/CLS-LOC/train

# Read the ImageNet Object Localization Challenge straight from the mount (no
# download). First 100 sorted wnid folders = ImageNet-100; val/test are carved
# from those labelled train images.
provision:
  manifest_sources:
    - path: /kaggle/input/competitions/imagenet-object-localization-challenge/ILSVRC/Data/CLS-LOC/train
      max_classes: 100
  validation_fraction: 0.1
  test_fraction: 0.1
  seed: 42

splits:
  full: /kaggle/working/imagenet100/splits/full/train.csv
  1pct: /kaggle/working/imagenet100/splits/1pct/train.csv
  3pct: /kaggle/working/imagenet100/splits/3pct/train.csv
  5pct: /kaggle/working/imagenet100/splits/5pct/train.csv
  10pct: /kaggle/working/imagenet100/splits/10pct/train.csv
  25pct: /kaggle/working/imagenet100/splits/25pct/train.csv
  50pct: /kaggle/working/imagenet100/splits/50pct/train.csv
  validation: /kaggle/working/imagenet100/splits/val.csv
  test: /kaggle/working/imagenet100/splits/test.csv

real_fractions:
  - 0.01
  - 0.03
  - 0.05
  - 0.10
  - 0.25
  - 0.50
  - 1.00

subset_strategy:
  nested: true
  stratified: true
  minimum_samples_per_class: 1

image:
  size: 224
  channels: 3

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
